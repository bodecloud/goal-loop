name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check rule copies
        run: node scripts/check-rule-copies.cjs

      - name: Check version consistency
        run: node scripts/check-versions.cjs

      - name: Build OpenClaw skills
        run: node scripts/build-openclaw-skills.cjs

      - name: Run tests
        run: npm test